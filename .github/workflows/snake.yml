name: Generate Snake Animation

on:
  # Chạy tự động mỗi 12 giờ
  schedule:
    - cron: "0 */12 * * *"
  # Cho phép chạy tay từ tab Actions
  workflow_dispatch:
  # Chạy khi push lên main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG (teal theme)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=6ae2f7&color_dots=#0d1117,#164e63,#0e7490,#22b8d6,#6ae2f7

      - name: Push snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
